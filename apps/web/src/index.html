<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pipoca</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='10 15 100 100'><g fill='%23f3c552'><circle cx='44' cy='42' r='21'/><circle cx='77' cy='42' r='21'/><circle cx='31' cy='68' r='19'/><circle cx='89' cy='68' r='19'/><circle cx='60' cy='66' r='28'/><circle cx='60' cy='86' r='20'/></g><path d='M49 99 C52 110 68 110 71 99 C66 95 54 95 49 99 Z' fill='%231a1712'/></svg>"
    />
    <meta name="theme-color" content="#1A1712" />
    <!-- Sets the theme before the first paint; theme.tsx keeps it in sync. -->
    <script>
      (function () {
        var choice = "system";

        try {
          choice = localStorage.getItem("pipoca.theme") || choice;
        } catch (error) {}

        if (choice !== "light" && choice !== "dark") {
          choice = matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        }

        document.documentElement.dataset.theme = choice;
      })();
    </script>
    <!-- The server serves these, so Bun's bundler mustn't try to resolve them. -->
    <script>
      [
        ["manifest", "/manifest.webmanifest"],
        ["apple-touch-icon", "/icon-192.png"],
      ].forEach(function (link) {
        var element = document.createElement("link");
        element.rel = link[0];
        element.href = link[1];
        document.head.appendChild(element);
      });
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
