[package]
name = "pipoca-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.21.7"
getrandom = "0.3.4"
sha2 = "0.10.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
tauri-plugin-updater = "2.14.1"

[profile.release]
lto = true
strip = true
