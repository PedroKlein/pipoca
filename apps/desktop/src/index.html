<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pipoca</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf9;
        --panel: #ffffff;
        --text: #1c1917;
        --muted: #78716c;
        --line: #e7e5e4;
        --accent: #d97706;
        --failed: #b91c1c;
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1917;
          --panel: #292524;
          --text: #f5f5f4;
          --muted: #a8a29e;
          --line: #44403c;
          --accent: #f59e0b;
          --failed: #f87171;
        }
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 48px 16px;
      }

      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }

      p {
        color: var(--muted);
        margin: 0 0 24px;
      }

      ul {
        list-style: none;
        margin: 0 0 24px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
      }

      li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
      }

      li + li {
        border-top: 1px solid var(--line);
      }

      li .name {
        flex: 1;
        min-width: 0;
      }

      li .detail {
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      li .failed {
        color: var(--failed);
        font-size: 12px;
        white-space: pre-wrap;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--line);
        flex: none;
      }

      .dot.on {
        background: var(--accent);
      }

      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      label {
        color: var(--muted);
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }

      form {
        display: flex;
        gap: 8px;
      }

      input[type="text"] {
        flex: 1;
        font: inherit;
        color: inherit;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pipoca</h1>
      <p>Pick where your Sessions run.</p>
      <ul id="connections"></ul>
      <form id="add">
        <input
          type="text"
          name="host"
          placeholder="user@host"
          aria-label="SSH host"
          required
        />
        <button type="submit">Add SSH machine</button>
      </form>
    </main>
    <script>
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      const failures = new Map();

      async function render() {
        const { connections, running, home } = await invoke("list");
        const list = document.getElementById("connections");
        list.replaceChildren(
          ...connections.map((connection) =>
            row(connection, connections, running.includes(connection.id), home),
          ),
        );
      }

      function row(connection, connections, on, home) {
        const item = document.createElement("li");
        const dot = document.createElement("span");
        dot.className = on ? "dot on" : "dot";
        dot.title = on ? "Running" : "Stopped";

        const name = document.createElement("div");
        name.className = "name";
        name.append(connection.name);

        const detail = document.createElement("div");
        detail.className = "detail";
        detail.textContent =
          connection.kind === "ssh"
            ? connection.host
            : (connection.folders.length > 0
                ? connection.folders
                : [home]
              ).join(", ");
        name.append(detail);

        const failure = failures.get(connection.id);
        if (failure !== undefined) {
          const failed = document.createElement("div");
          failed.className = "failed";
          failed.setAttribute("role", "alert");
          failed.textContent = failure;
          name.append(failed);
        }

        const atLogin = document.createElement("label");
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = connection.atLogin;
        box.addEventListener("change", () =>
          save(
            connections.map((c) =>
              c.id === connection.id ? { ...c, atLogin: box.checked } : c,
            ),
          ),
        );
        atLogin.append(box, "Start at login");

        const open = document.createElement("button");
        open.className = "primary";
        open.textContent = "Open";
        open.addEventListener("click", () => {
          failures.delete(connection.id);
          invoke("open", { id: connection.id }).then(
            render,
            failedTo(connection),
          );
        });

        item.append(dot, name, atLogin, open);

        if (on) {
          const stop = document.createElement("button");
          stop.textContent = "Stop";
          stop.addEventListener("click", () =>
            invoke("stop", { id: connection.id }).then(render),
          );
          item.append(stop);
        } else if (connection.kind === "ssh") {
          const remove = document.createElement("button");
          remove.textContent = "Remove";
          remove.addEventListener("click", () =>
            save(connections.filter((c) => c.id !== connection.id)),
          );
          item.append(remove);
        }

        return item;
      }

      function failedTo(connection) {
        return (error) => {
          failures.set(connection.id, String(error));
          render();
        };
      }

      async function save(connections) {
        await invoke("save", { connections });
        await render();
      }

      document
        .getElementById("add")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const host = event.target.host.value.trim();
          const { connections } = await invoke("list");
          const ports = connections
            .filter((c) => c.kind === "ssh")
            .map((c) => c.localPort);

          // This Mac serves on 7420, so each machine tunnels to its own port.
          const localPort = Math.max(7420, ...ports) + 1;

          await save([
            ...connections,
            {
              id: crypto.randomUUID(),
              name: host,
              kind: "ssh",
              host,
              localPort,
              atLogin: false,
            },
          ]);
          event.target.reset();
        });

      listen("stopped", ({ payload }) => {
        failures.set(
          payload.id,
          `${payload.error}\nThe whole log is in ${payload.log}`,
        );
        render();
      });

      render();
    </script>
  </body>
</html>
