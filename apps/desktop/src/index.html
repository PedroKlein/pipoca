<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pipoca</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafaf9;
        --panel: #ffffff;
        --text: #1c1917;
        --muted: #78716c;
        --line: #e7e5e4;
        --accent: #d97706;
        --failed: #b91c1c;
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1917;
          --panel: #292524;
          --text: #f5f5f4;
          --muted: #a8a29e;
          --line: #44403c;
          --accent: #f59e0b;
          --failed: #f87171;
        }
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 48px 16px;
      }

      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }

      p {
        color: var(--muted);
        margin: 0 0 24px;
      }

      ul {
        list-style: none;
        margin: 0 0 24px;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
      }

      li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
      }

      li + li {
        border-top: 1px solid var(--line);
      }

      li .name {
        flex: 1;
        min-width: 0;
      }

      li .detail {
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      li .failed {
        color: var(--failed);
        font-size: 12px;
        white-space: pre-wrap;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--line);
        flex: none;
      }

      .dot.on {
        background: var(--accent);
      }

      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 10px;
        cursor: pointer;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      #update {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 24px;
        padding: 12px 16px;
        border: 1px solid var(--accent);
        border-radius: 10px;
        background: var(--panel);
        color: var(--text);
      }

      #update span {
        flex: 1;
      }

      label {
        color: var(--muted);
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }

      form {
        display: flex;
        gap: 8px;
      }

      input[type="text"] {
        flex: 1;
        font: inherit;
        color: inherit;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pipoca</h1>
      <p>Pick where your Sessions run.</p>
      <div id="update" role="status" hidden>
        <span></span>
        <button type="button" class="primary">Update and restart</button>
      </div>
      <ul id="connections"></ul>
      <form id="add">
        <input
          type="text"
          name="place"
          placeholder="user@host or https://pipoca.example.com"
          aria-label="SSH host or server URL"
          required
        />
        <button type="submit">Add</button>
      </form>
    </main>
    <script>
      const { invoke } = window.__TAURI__.core;
      const { listen } = window.__TAURI__.event;
      const notes = new Map();

      async function render() {
        const { connections, running, signingIn, home, update } =
          await invoke("list");
        showUpdate(update);
        const list = document.getElementById("connections");
        list.replaceChildren(
          ...connections.map((connection) =>
            row(
              connection,
              connections,
              running.includes(connection.id),
              signingIn.includes(connection.id),
              home,
            ),
          ),
        );
      }

      function row(connection, connections, on, signingIn, home) {
        const item = document.createElement("li");
        const dot = document.createElement("span");
        dot.className = on ? "dot on" : "dot";
        dot.title = on ? "Running" : "Stopped";

        const name = document.createElement("div");
        name.className = "name";
        name.append(connection.name);

        const detail = document.createElement("div");
        detail.className = "detail";
        detail.textContent =
          connection.kind === "ssh"
            ? connection.host
            : connection.kind === "server"
              ? connection.url
              : (connection.folders.length > 0
                  ? connection.folders
                  : [home]
                ).join(", ");
        name.append(detail);

        const note =
          notes.get(connection.id) ??
          (signingIn
            ? { text: "Finish signing in in your browser.", failed: false }
            : undefined);
        if (note !== undefined) {
          const shown = document.createElement("div");
          shown.className = note.failed ? "failed" : "detail";
          shown.setAttribute("role", note.failed ? "alert" : "status");
          shown.textContent = note.text;
          name.append(shown);
        }

        const atLogin = document.createElement("label");
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = connection.atLogin;
        box.addEventListener("change", () =>
          save(
            connections.map((c) =>
              c.id === connection.id ? { ...c, atLogin: box.checked } : c,
            ),
          ),
        );
        atLogin.append(box, "Start at login");

        // A server connection runs nothing here to start.
        atLogin.hidden = connection.kind === "server";

        const open = document.createElement("button");
        open.className = "primary";
        open.textContent = "Open";
        open.addEventListener("click", () => {
          notes.delete(connection.id);
          invoke("open", { id: connection.id }).then(
            render,
            failedTo(connection),
          );
        });

        item.append(dot, name, atLogin, open);

        if (on) {
          const stop = document.createElement("button");
          stop.textContent = "Stop";
          stop.addEventListener("click", () =>
            invoke("stop", { id: connection.id }).then(render),
          );
          item.append(stop);
        } else if (connection.kind !== "thisMac") {
          const remove = document.createElement("button");
          remove.textContent = "Remove";
          remove.addEventListener("click", () =>
            save(connections.filter((c) => c.id !== connection.id)),
          );
          item.append(remove);
        }

        return item;
      }

      let updateFailed = "";

      function showUpdate(version) {
        const banner = document.getElementById("update");
        banner.hidden = version === null;
        banner.querySelector("span").textContent =
          updateFailed ||
          `Pipoca ${version} is out. Updating stops what's running here and restarts the app.`;
      }

      document
        .querySelector("#update button")
        .addEventListener("click", ({ target }) => {
          target.disabled = true;
          target.textContent = "Updating…";
          invoke("update").catch((error) => {
            updateFailed = String(error);
            target.disabled = false;
            target.textContent = "Try again";
            render();
          });
        });

      function failedTo(connection) {
        return (error) => {
          notes.set(connection.id, { text: String(error), failed: true });
          render();
        };
      }

      async function save(connections) {
        await invoke("save", { connections });
        await render();
      }

      document
        .getElementById("add")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const place = event.target.place.value.trim();
          const { connections } = await invoke("list");
          const ports = connections
            .filter((c) => c.kind === "ssh")
            .map((c) => c.localPort);

          // This Mac serves on 7420, so each machine tunnels to its own port.
          const localPort = Math.max(7420, ...ports) + 1;
          const id = crypto.randomUUID();

          await save([
            ...connections,
            /^https?:\/\//.test(place)
              ? {
                  id,
                  name: new URL(place).host,
                  kind: "server",
                  url: new URL("/", place).href,
                  atLogin: false,
                }
              : {
                  id,
                  name: place,
                  kind: "ssh",
                  host: place,
                  localPort,
                  atLogin: false,
                },
          ]);
          event.target.reset();
        });

      listen("stopped", ({ payload }) => {
        notes.set(payload.id, {
          text: `${payload.error}\nThe whole log is in ${payload.log}`,
          failed: true,
        });
        render();
      });

      listen("signing-in", render);

      listen("update", render);

      listen("failed", ({ payload }) => {
        notes.set(payload.id, { text: payload.error, failed: true });
        render();
      });

      render();
    </script>
  </body>
</html>
