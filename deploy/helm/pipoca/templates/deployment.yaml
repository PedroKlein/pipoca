apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "pipoca.labels" . | nindent 4 }}
spec:
  # The store is SQLite on a ReadWriteOnce volume (ADR 0034).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pipoca.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pipoca.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.runnerPods.enabled }}
      serviceAccountName: {{ .Release.Name }}
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      {{- if include "pipoca.config" . }}
      initContainers:
        # Seeds the config folder on the data volume once. After that Settings
        # and people edit the file there (ADR 0039).
        - name: config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - mkdir -p /data/config && { test -e /data/config/pipoca.json || cp /seed/pipoca.json /data/config/pipoca.json; }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /seed
              readOnly: true
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --port
            - "7420"
            {{- with .Values.url }}
            - --url
            - {{ . | quote }}
            {{- end }}
            {{- if .Values.trustProxy }}
            - --trust-proxy
            {{- end }}
            {{- if (.Values.oidc | default dict).ssoOnly }}
            - --sso-only
            {{- end }}
            {{- if .Values.lockedConfig }}
            - --locked-config
            - /etc/pipoca/pipoca.json
            {{- end }}
            {{- with .Values.builtInRunner }}
            - --provider
            - {{ . | quote }}
            {{- end }}
          env:
            - name: PIPOCA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pipoca.secretName" . }}
                  key: secretKey
            {{- if .Values.runnerPods.enabled }}
            - name: PIPOCA_IMAGE
              value: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            - name: PIPOCA_IMAGE_PULL_POLICY
              value: {{ .Values.image.pullPolicy | quote }}
            - name: PIPOCA_RUNNER_URL
              value: "http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}"
            # Its image ID tells runner pods with an old binary apart.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 7420
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.lockedConfig }}
            - name: locked-config
              mountPath: /etc/pipoca
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- if include "pipoca.config" . }}
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        {{- end }}
        {{- if .Values.lockedConfig }}
        - name: locked-config
          configMap:
            name: {{ .Release.Name }}-locked-config
        {{- end }}
