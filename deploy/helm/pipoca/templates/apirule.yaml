{{- if .Values.apiRule.enabled }}
{{- $methods := list "GET" "POST" "PUT" "PATCH" "DELETE" }}
apiVersion: gateway.kyma-project.io/v2
kind: APIRule
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "pipoca.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.apiRule.host }}
  gateway: {{ .Values.apiRule.gateway }}
  service:
    name: {{ .Release.Name }}
    port: {{ .Values.service.port }}
  # The server signs people and runners in itself, so the gateway only keeps
  # out the paths a browser never needs. A path no rule matches is refused,
  # so the setup link only works through a port-forward. Kyma ends a request
  # after 180 seconds unless its rule says otherwise, so the rules that serve
  # streams and terminals take 3900, the most an APIRule allows.
  rules:
    - path: /
      methods: [GET]
      noAuth: true
    # The web UI's bundled files.
    - path: /{*}
      methods: [GET]
      noAuth: true
    - path: /api/auth
      methods: [GET]
      noAuth: true
    - path: /api/auth/session
      methods: [POST, DELETE]
      noAuth: true
    # The desktop app's sign-in (ADR 0055).
    - path: /api/auth/app-links
      methods: [POST]
      noAuth: true
    - path: /api/auth/links/{*}
      methods: [GET]
      noAuth: true
    - path: /api/auth/invites/{*}
      methods: [GET, POST]
      noAuth: true
    - path: /api/changes
      methods: [GET]
      noAuth: true
      timeout: 3900
    # A Session's events and terminal.
    - path: /api/sessions
      methods: {{ toJson $methods }}
      noAuth: true
    - path: /api/sessions/{**}
      methods: {{ toJson $methods }}
      noAuth: true
      timeout: 3900
    # The route table's other paths, which `bun run apirule` in apps/pipoca
    # writes.
    {{- range list "environment-templates" "environments" "ext" "invites" "join-keys" "me" "people" "plugins" "profiles" "repositories" "server" "settings" }}
    - path: /api/{{ . }}
      methods: {{ toJson $methods }}
      noAuth: true
    - path: /api/{{ . }}/{**}
      methods: {{ toJson $methods }}
      noAuth: true
    {{- end }}
    {{- if .Values.apiRule.exposeMcp }}
    - path: /api/mcp
      methods: [GET, POST, DELETE]
      noAuth: true
      timeout: 3900
    {{- end }}
    {{- if .Values.apiRule.exposeAgents }}
    - path: /runner/{**}
      methods: {{ toJson $methods }}
      noAuth: true
      timeout: 3900
    {{- end }}
{{- end }}
{{- if .Values.apiRule.enabled }}
---
# The APIRule's policies let in only the gateway, which would also shut out
# the runner pods that reach the server through its Service. Team Sessions
# also send their model calls to the logins plugin's proxy (ADR 0066), at
# its public route proxy/:provider/*rest.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Release.Name }}-runners
  labels:
    {{- include "pipoca.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "pipoca.labels" . | nindent 6 }}
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: [{{ .Release.Namespace }}]
      to:
        - operation:
            paths: ["/runner/*", "/api/ext/logins/proxy/*"]
{{- end }}
