image:
  repository: ghcr.io/pedroklein/pipoca
  # main follows the main branch; pin a sha-<commit> tag for a steady install.
  tag: main
  # Always, since main moves: a node that has an older main keeps running it,
  # and runner pods copy the pipoca binary from it. A check finds the layers
  # cached, so IfNotPresent saves little, and suits only a pinned tag.
  pullPolicy: Always

# Where people open the server, such as https://pi.example.com. The setup link
# in the log points here. Defaults to https://<apiRule.host> on Kyma.
url: ""

# Kyma's gateway, which ends HTTPS in front of the server (ADR 0034).
apiRule:
  enabled: false
  host: ""
  gateway: kyma-system/kyma-gateway
  # MCP clients, such as Claude Code or Pi, outside the cluster.
  exposeMcp: false
  # Runners outside the cluster, such as a laptop. Runner pods reach the
  # server through its Service.
  exposeAgents: false

# Counts failed sign-ins by the client address that a proxy in front, such as
# an ingress controller, adds to X-Forwarded-For. Set it only when every
# request comes through that proxy; on Kyma, apiRule.enabled sets it. Without
# it everyone shares the proxy's address.
trustProxy: false

# Runs a runner inside the server too, in the Environment of this name. Only
# with runnerPods.enabled false: a server that starts runner pods leaves it off,
# since its Sessions would share the server pod's files (ADR 0049).
builtInRunner: ""

# A Secret with a `secretKey` entry: 32 bytes, base64. When empty, the chart
# makes one on install and keeps it on upgrades.
existingSecret: ""

# Single sign-on through OpenID Connect providers (ADR 0038), which admins
# add in Settings.
oidc:
  # Turns the password login off, once your user signs in through the
  # provider. The setup link still works.
  ssoOnly: false

persistence:
  size: 5Gi
  storageClass: ""

service:
  port: 7420

resources: {}

# Lets the kubernetes plugin start runner pods in this namespace, with a
# service account allowed to manage pods, Secrets and claims here (ADR 0032).
runnerPods:
  enabled: true
  # A NetworkPolicy that refuses every incoming connection to runner pods, so
  # people's pods can't reach each other (ADR 0053). It needs a network
  # plugin that enforces NetworkPolicy, as Kyma's does.
  refuseIncoming: true

# More environment for the server, such as PIPOCA_FAUX_REPLY in tests, or
# a secret a plugin's config names, taken from a Secret with valueFrom.
extraEnv: []
# Whole Secrets or ConfigMaps as environment, such as client secrets.
extraEnvFrom: []

# The first pipoca.json of the server's config folder, a key per plugin
# (ADR 0039). It is written to the data volume only when no file is there
# yet; after that Settings edits the file, and so can you. Secrets don't go
# here: name an environment variable instead, such as oidc's clientSecretEnv.
config: {}
