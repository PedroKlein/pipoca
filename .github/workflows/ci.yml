name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun x playwright-core install --with-deps chromium
      - run: bun run test:e2e

  kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: helm/kind-action@v1
        with:
          cluster_name: pipoca
      # Releases installed before a values block existed upgrade with --reuse-values.
      - run: helm template pipoca deploy/helm/pipoca --set oidc=null > /dev/null
      - name: A locked config mounts read-only and reaches the server
        run: |
          out=$(helm template pipoca deploy/helm/pipoca --set-json 'lockedConfig={"oidc":{"providers":[]}}')
          grep -q -- "--locked-config" <<<"$out"
          grep -q "pipoca-locked-config" <<<"$out"
      - name: The APIRule keeps runners and MCP out unless asked
        run: |
          rule() { helm template pipoca deploy/helm/pipoca --set apiRule.enabled=true --set apiRule.host=pi.example.com "$@" --show-only templates/apirule.yaml; }
          ! rule | grep -E 'path: /(agent|api/mcp$|api/auth/setup)'
          rule --set apiRule.exposeAgents=true --set apiRule.exposeMcp=true | grep -E 'path: /agent/'
          rule --set apiRule.exposeMcp=true | grep -E 'path: /api/mcp$'
          rule | grep -A20 'kind: AuthorizationPolicy' | grep -F '"/agent/*"'
      - name: Previews get their own host only when asked
        run: |
          previews() { helm template pipoca deploy/helm/pipoca --set apiRule.enabled=true --set apiRule.host=pi.example.com "$@"; }
          ! previews | grep -F 'pipoca-previews'
          previews --set apiRule.previews=true --show-only templates/previews.yaml | grep -cF '"*.pi.example.com"' | grep -x 3
      - run: docker build -t pipoca:ci .
      - run: kind load docker-image pipoca:ci --name pipoca
      - run: >-
          helm install pipoca deploy/helm/pipoca --wait --timeout 3m
          --set image.repository=pipoca --set image.tag=ci
          --set image.pullPolicy=Never
          --set extraEnv[0].name=PIPOCA_FAUX_REPLY
          --set "extraEnv[0].value=hello from kind"
          --set config.oidc.providers[0].id=kind
          --set "config.oidc.providers[0].label=Sign in with kind"
          --set config.oidc.providers[0].issuer=https://kind.example
          --set config.oidc.providers[0].clientId=pipoca
      - run: bun test ./apps/pipoca/src/kind.e2e.ts
      - if: failure()
        run: >-
          kubectl describe pods; kubectl logs deploy/pipoca --all-containers;
          kubectl logs kind-agent;
          kubectl logs -l app.kubernetes.io/managed-by=pipoca --all-containers --prefix
