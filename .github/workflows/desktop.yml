name: Desktop

on:
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: bun run --cwd apps/desktop build -- --bundles app,dmg
      # Apple silicon calls an app with no signature at all damaged.
      - run: codesign --verify --deep --strict --verbose=2 apps/desktop/src-tauri/target/release/bundle/macos/Pipoca.app
      - run: cargo clippy --release --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Pipoca-macos
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/desktop build -- --bundles deb
      - run: cargo clippy --release --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
