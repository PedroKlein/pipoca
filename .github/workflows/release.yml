name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # `pipoca connect` downloads the release named after its own version.
      - name: The tag matches the version pipoca reports
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version apps/pipoca/package.json)"
      - name: Build pipoca for each system
        working-directory: apps/pipoca
        run: |
          for platform in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            bun src/build.ts --target "bun-$platform" --outfile "dist/pipoca-$platform"
          done
          cd dist && sha256sum pipoca-* > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes apps/pipoca/dist/pipoca-* apps/pipoca/dist/SHA256SUMS

  macos:
    needs: cli
    environment: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run --cwd apps/desktop build -- --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/desktop/src-tauri/target/release/bundle
        run: |
          update="Pipoca_${GITHUB_REF_NAME#v}_aarch64.app.tar.gz"
          mv macos/Pipoca.app.tar.gz "$update"
          mv macos/Pipoca.app.tar.gz.sig "$update.sig"
          gh release upload "$GITHUB_REF_NAME" dmg/*.dmg "$update" "$update.sig"

  linux:
    needs: cli
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run --cwd apps/desktop build -- --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/desktop/src-tauri/target/release/bundle
        run: gh release upload "$GITHUB_REF_NAME" deb/*.deb deb/*.deb.sig appimage/*.AppImage appimage/*.AppImage.sig

  # The app looks for updates in latest.json on the newest release.
  updates:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$REPO" --pattern '*.sig'
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/$REPO/releases/download/$GITHUB_REF_NAME"
          entry() { jq -n --arg url "$base/$1" --rawfile signature "$1.sig" '{url: $url, signature: $signature}'; }
          appimage="$(entry "Pipoca_${version}_amd64.AppImage")"
          jq -n --arg version "$version" \
            --argjson mac "$(entry "Pipoca_${version}_aarch64.app.tar.gz")" \
            --argjson appimage "$appimage" \
            --argjson deb "$(entry "Pipoca_${version}_amd64.deb")" \
            '{version: $version, pub_date: (now | todate), platforms: {"darwin-aarch64": $mac, "linux-x86_64": $appimage, "linux-x86_64-appimage": $appimage, "linux-x86_64-deb": $deb}}' > latest.json
          gh release upload "$GITHUB_REF_NAME" --repo "$REPO" latest.json

  # The tap is updated after the files it points to are on the release.
  homebrew:
    needs: [cli, macos]
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: PedroKlein/homebrew-pipoca
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^  version \".*\"/  version \"$version\"/" Formula/pipoca.rb Casks/pipoca-app.rb
          gh api "repos/$REPO/releases/tags/$GITHUB_REF_NAME" --jq '.assets[] | "\(.name) \(.digest)"' |
            while read -r name digest; do
              sum="${digest#sha256:}"
              case "$name" in
                pipoca-*)
                  awk -v name="/$name\"" -v sum="$sum" '
                    index($0, name) { found = 1 }
                    found && /sha256 "/ { sub(/sha256 ".*"/, "sha256 \"" sum "\""); found = 0 }
                    { print }' Formula/pipoca.rb > formula.rb
                  mv formula.rb Formula/pipoca.rb
                  ;;
                *.dmg) sed -i "s/^  sha256 \".*\"/  sha256 \"$sum\"/" Casks/pipoca-app.rb ;;
              esac
            done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "pipoca $version"
          git push
