<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A. The main screen</title>
    <style>
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
        display: grid;
        grid-template-columns: 240px 1fr;
        grid-template-rows: 56px 1fr;
        font:
          14px/1.5 system-ui,
          sans-serif;
        color: #1d2433;
        background: #f6f7f9;
      }

      header {
        grid-column: 1 / 3;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        background: #ffffff;
        border-bottom: 1px solid #e2e5eb;
      }

      header b {
        flex: 1;
      }

      nav {
        padding: 16px 12px;
        background: #ffffff;
        border-right: 1px solid #e2e5eb;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      nav a {
        padding: 6px 10px;
        border-radius: 6px;
        color: inherit;
        text-decoration: none;
      }

      nav a[aria-current] {
        background: #eef0f4;
        font-weight: 600;
      }

      main {
        padding: 28px 32px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      h1 {
        font-size: 22px;
        margin: 0;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }

      .card {
        background: #ffffff;
        border: 1px solid #e2e5eb;
        border-radius: 10px;
        padding: 16px;
      }

      .card span {
        display: block;
        color: #5b6475;
        font-size: 13px;
      }

      button {
        font: inherit;
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid #1d2433;
        background: #1d2433;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <header>
      <b>The product's name</b>
      <button type="button">The main action</button>
    </header>
    <nav aria-label="Sections">
      <a href="Main.html" aria-current="page">The first section</a>
      <a href="Main.html">The second section</a>
      <a href="Main.html">Settings</a>
    </nav>
    <main>
      <h1>What this screen is for</h1>
      <div class="cards">
        <div class="card">
          <b>The first thing people look for</b>
          <span>Why they look for it</span>
        </div>
        <div class="card">
          <b>The second</b>
          <span>Why they look for it</span>
        </div>
        <div class="card">
          <b>The third</b>
          <span>Why they look for it</span>
        </div>
      </div>
    </main>
  </body>
</html>
